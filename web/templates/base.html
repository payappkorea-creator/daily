<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}전남행복버스 일정관리{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
      <i class="bi bi-bus-front-fill me-1"></i> 전남행복버스
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">
            <i class="bi bi-speedometer2"></i> 대시보드
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/schedules' in request.path %}active{% endif %}" href="{{ url_for('schedules.list_schedules') }}">
            <i class="bi bi-list-ul"></i> 일정 목록
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/calendar' %}active{% endif %}" href="{{ url_for('calendar.calendar_page') }}">
            <i class="bi bi-calendar3"></i> 캘린더
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/statistics' %}active{% endif %}" href="{{ url_for('statistics.statistics_page') }}">
            <i class="bi bi-bar-chart-fill"></i> 통계
          </a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link position-relative" href="{{ url_for('schedules.list_schedules') }}" id="notif-bell">
            <i class="bi bi-bell-fill fs-5"></i>
            <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none">0</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
