{% extends "base.html" %}
{% block title %}캘린더 — 전남행복버스{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-calendar3 me-2"></i>일정 캘린더</h4>
  <a href="{{ url_for('schedules.new_schedule') }}" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg me-1"></i>새 일정 등록
  </a>
</div>

<!-- 범례 -->
<div class="d-flex gap-3 mb-3 flex-wrap">
  <span><span class="badge bg-primary me-1">&nbsp;</span>예정</span>
  <span><span class="badge bg-warning me-1">&nbsp;</span>진행중</span>
  <span><span class="badge bg-success me-1">&nbsp;</span>완료</span>
  <span><span class="badge bg-secondary me-1">&nbsp;</span>취소</span>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div id="calendar"></div>
  </div>
</div>

<!-- 일정 상세 모달 (캘린더 클릭 시) -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        <a id="modal-detail-link" href="#" class="btn btn-primary">상세 보기</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
